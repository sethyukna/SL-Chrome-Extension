<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>SL Utility</title>
  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <h2>SL Utility</h2>
  <form>
    <fieldset class="open-with-id">
      <input type="text" placeholder="Enter locker id" class="guid" />
      <div>
        <label class="action-label">Open locker in:</label>
        <div class="button-wrapper">
          <button type="button" data-openin="dev" data-pageurl="locker-manager-edit">Dev</button>
          <button type="button" data-openin="qa" data-pageurl="locker-manager-edit">QA</button>
          <button type="button" data-openin="prod" data-pageurl="locker-manager-edit">PROD</button>
          <button type="button" data-openin="local" data-pageurl="locker-manager-edit">Local</button>
        </div>
      </div>
    </fieldset>
    <fieldset class="open-with-id">
      <input type="text" placeholder="Enter Order ID" class="guid" />
      <div>
        <label class="action-label">Open order in:</label>
        <div class="button-wrapper">
          <button type="button" data-openin="dev" data-pageurl="order-management">Dev</button>
          <button type="button" data-openin="qa" data-pageurl="order-management">QA</button>
          <button type="button" data-openin="prod" data-pageurl="order-management">PROD</button>
          <button type="button" data-openin="local" data-pageurl="order-management">Local</button>
        </div>
      </div>
    </fieldset>
    <fieldset id="open-recent" hidden>
      <label class="action-label" for="open-link-recent">Open recent item:</label>
      <select id="open-link-recent"></select>
      <div>
        <div class="button-wrapper">
          <button type="button" data-openrecent="dev">Dev</button>
          <button type="button" data-openrecent="qa">QA</button>
          <button type="button" data-openrecent="prod">PROD</button>
          <button type="button" data-openrecent="local">Local</button>
        </div>
        <button type="button" id="clear-recent" class="link-button">Clear</button>
      </div>
    </fieldset>
  </form>
  <script src="popup.js"></script>
</body>

</html>
