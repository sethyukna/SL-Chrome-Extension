  <h2><img src="img.png" />Blackbaud Utility</h4>
  <form>
    <fieldset class="open-with-guid">
      <input type="text" placeholder="Enter Constituent Guid" class="guid" />
      <div>
        <label class="action-label">Open constituent in:</label>
        <div class="button-wrapper">
          <button data-openin="dev" data-pageid="88159265-2b7e-4c7b-82a2-119d01ecd40f">Dev</button>
          <button data-openin="qa" data-pageid="88159265-2b7e-4c7b-82a2-119d01ecd40f">QA</button>
          <button data-openin="prod" data-pageid="88159265-2b7e-4c7b-82a2-119d01ecd40f">PROD</button>
          <button data-openin="local" data-pageid="88159265-2b7e-4c7b-82a2-119d01ecd40f">Local</button>
        </div>
      </div>
    </fieldset>    
    <fieldset class="open-with-guid">
      <input type="text" placeholder="Enter Gift Guid" class="guid" />
      <div>
        <label class="action-label">Open gift in:</label>
        <div class="button-wrapper">
          <button data-openin="dev" data-pageid="387f861b-6c03-486c-9ff5-9cc5bb7a5275">Dev</button>
          <button data-openin="qa"  data-pageid="387f861b-6c03-486c-9ff5-9cc5bb7a5275">QA</button>
          <button data-openin="prod" data-pageid="387f861b-6c03-486c-9ff5-9cc5bb7a5275">PROD</button>
          <button data-openin="local" data-pageid="387f861b-6c03-486c-9ff5-9cc5bb7a5275">Local</button>
        </div>
      </div>
    </fieldset>
    <fieldset id="open-in-environment">
      <div>
        <label class="action-label">Open current page in:</label>
        <div class="button-wrapper">
          <button  data-openin="dev">Dev</button>
          <button data-openin="qa">QA</button>
          <button  data-openin="prod">PROD</button>
          <button  data-openin="local">Local</button>
        </div>
      </div>
    </fieldset>
    <fieldset id="open-recent">
      <div>
        <label class="action-label">Open recent search item: </label>
        <div class="button-wrapper">
          <select id="open-link-recent">
          </select>
          <br />
          <button  data-openin="dev">Dev</button>
          <button data-openin="qa">QA</button>
          <button  data-openin="prod">PROD</button>
          <button  data-openin="local">Local</button>
        </div>
      </div>
    </fieldset>
  </form>
